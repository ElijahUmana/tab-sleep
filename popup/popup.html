<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Sleep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand-mark" aria-hidden="true">☾</div>
      <div>
        <h1>Tab Sleep</h1>
        <p id="statusText">Loading…</p>
      </div>
      <label class="switch" aria-label="Enable Tab Sleep">
        <input id="enabled" type="checkbox">
        <span></span>
      </label>
    </header>

    <section class="hero" aria-live="polite">
      <div>
        <strong id="sleepingCount">—</strong>
        <span>tabs frozen</span>
      </div>
      <div>
        <strong id="idleTime">2 min</strong>
        <span>idle threshold</span>
      </div>
      <div>
        <strong id="reclaimedMemory">—</strong>
        <span>memory reclaimed</span>
      </div>
    </section>

    <section class="current-tab">
      <div>
        <h2>This tab</h2>
        <p id="currentTabDescription">Keep this page awake while you work.</p>
      </div>
      <label class="switch compact" aria-label="Keep this tab awake">
        <input id="protected" type="checkbox">
        <span></span>
      </label>
    </section>

    <button id="whyAwakeToggle" class="link-toggle" type="button" aria-expanded="false" aria-controls="whyAwakePanel" hidden>Why is this tab awake?</button>
    <ul id="whyAwakePanel" class="reason-trace" hidden></ul>

    <button id="sleepNow" class="primary" type="button">
      <span aria-hidden="true">☾</span>
      Freeze inactive tabs now
    </button>

    <details class="power-menu">
      <summary>Bulk actions</summary>
      <div class="bulk-grid">
        <button id="freezeWindow" class="bulk-button" type="button">Freeze window</button>
        <button id="freezeOthers" class="bulk-button" type="button">Freeze others</button>
        <button id="freezeAll" class="bulk-button" type="button">Freeze all</button>
        <button id="wakeAll" class="bulk-button" type="button">Wake all</button>
        <button id="keepDomain" class="bulk-button" type="button">Keep site awake 1 h</button>
      </div>
      <p id="nextScanLine" class="hint-line"></p>
    </details>

    <div id="message" role="status" aria-live="polite"></div>

    <footer>
      <span id="totalCount">0 frozen total</span>
      <button id="options" type="button">Settings</button>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
