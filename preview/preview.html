<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleeping tab</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main id="preview" role="button" aria-label="Wake frozen page" tabindex="0">
    <div id="documentSurface">
      <canvas id="snapshot" hidden aria-label="Frozen snapshot of the sleeping page"></canvas>
      <div id="documentTiles" hidden aria-label="Frozen full-page tiles"></div>
      <div id="nestedRegions" aria-label="Frozen scrollable page regions"></div>
    </div>
    <section id="missing" hidden aria-labelledby="missingTitle">
      <div class="moon" aria-hidden="true"></div>
      <p class="eyebrow">Frozen visual unavailable</p>
      <h1 id="missingTitle">This tab is still asleep</h1>
      <p id="missingSite">Its saved image is no longer available.</p>
      <strong>Click anywhere to restore the live page</strong>
    </section>
    <iframe id="domSnapshot" hidden sandbox="allow-same-origin" referrerpolicy="no-referrer" title="Frozen page content"></iframe>
  </main>
  <div id="wakeBar" role="status" aria-live="polite">
    <span id="badge"><strong>Sleeping</strong><span id="meta">Click the frozen page to wake</span></span>
  </div>
  <div id="waking" hidden role="status" aria-live="assertive">Waking…</div>
  <script type="module" src="preview.js"></script>
</body>
</html>
