<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Tab Sleep parked runtime and wake path</title>
  <desc id="desc">A content-addressed preview becomes an inert parked page. Inspection remains frozen, while a trusted action creates a durable waking transaction and restores the live page in the same tab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17233a"/><stop offset="1" stop-color="#1d2d49"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0L12 6L0 12Z" fill="#79c0ff"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0 0L12 6L0 12Z" fill="#3fb950"/></marker>
    <style>
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc;letter-spacing:1px}.subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb3c8}.label{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}.detail{font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b8c7d9}.edge{stroke:#79c0ff;stroke-width:4;fill:none;marker-end:url(#arrow)}.box{fill:url(#node);stroke:#58a6ff;stroke-width:3}
    </style>
  </defs>
  <rect x="4" y="4" width="1192" height="892" rx="28" fill="url(#bg)" stroke="#2f81f7" stroke-width="4"/>
  <text x="70" y="62" class="title">PARKED RUNTIME AND WAKE</text>
  <text x="70" y="96" class="subtitle">Inspection remains inert; only trusted intent crosses into execution</text>

  <rect x="280" y="135" width="640" height="92" rx="18" class="box"/>
  <text x="600" y="175" class="label" text-anchor="middle">Content-addressed preview record</text>
  <text x="600" y="207" class="detail" text-anchor="middle">Geometry · metadata · deduplicated image blobs</text>
  <path d="M600 227V268" class="edge"/>

  <rect x="220" y="275" width="760" height="115" rx="20" fill="#211d38" stroke="#bc8cff" stroke-width="3"/>
  <text x="600" y="320" class="label" text-anchor="middle">5 · Inert parked runtime</text>
  <text x="600" y="354" class="detail" text-anchor="middle">Natural-height document tiles + independent frozen scroll regions</text>

  <path d="M390 390V455" class="edge"/>
  <path d="M810 390V455" class="edge"/>
  <rect x="90" y="462" width="500" height="115" rx="18" fill="#173a31" stroke="#3fb950" stroke-width="3"/>
  <text x="340" y="506" class="label" text-anchor="middle">Select or scroll</text>
  <text x="340" y="540" class="detail" text-anchor="middle">Remain frozen · renderer stays gone</text>
  <path d="M90 520H45V332H208" fill="none" stroke="#3fb950" stroke-width="4" marker-end="url(#greenArrow)"/>

  <rect x="610" y="462" width="500" height="115" rx="18" class="box"/>
  <text x="860" y="506" class="label" text-anchor="middle">Trusted wake intent</text>
  <text x="860" y="540" class="detail" text-anchor="middle">Click · Enter · Space · explicit command</text>

  <path d="M860 577V625" class="edge"/>
  <rect x="610" y="632" width="500" height="82" rx="18" class="box"/>
  <text x="860" y="683" class="label" text-anchor="middle">Persist WAKING transaction</text>
  <path d="M860 714V755" class="edge"/>

  <rect x="610" y="762" width="500" height="82" rx="18" fill="#173a31" stroke="#3fb950" stroke-width="3"/>
  <text x="860" y="798" class="label" text-anchor="middle">Same-tab restore</text>
  <text x="860" y="828" class="detail" text-anchor="middle">location.replace → load complete → cleanup</text>
</svg>
