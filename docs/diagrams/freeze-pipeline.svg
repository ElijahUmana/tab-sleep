<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tab Sleep freeze transaction</title>
  <desc id="desc">Runtime signals pass through policy, whole-page capture, restoration, commit-time revalidation, and an atomic IndexedDB commit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c31"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17233a"/>
      <stop offset="1" stop-color="#1d2d49"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12Z" fill="#79c0ff"/>
    </marker>
    <style>
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc;letter-spacing:1px}
      .subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9fb3c8}
      .label{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f0f6fc}
      .detail{font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b8c7d9}
      .step{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#07111f;text-anchor:middle}
      .edge{stroke:#79c0ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .box{fill:url(#node);stroke:#58a6ff;stroke-width:3}
    </style>
  </defs>
  <rect x="4" y="4" width="1192" height="992" rx="28" fill="url(#bg)" stroke="#2f81f7" stroke-width="4"/>
  <text x="70" y="62" class="title">FREEZE TRANSACTION</text>
  <text x="70" y="96" class="subtitle">Fresh evidence → complete capture → final safety gate → durable preview</text>

  <rect x="220" y="135" width="760" height="100" rx="18" class="box"/>
  <circle cx="275" cy="185" r="29" fill="#79c0ff"/>
  <text x="275" y="193" class="step">1</text>
  <text x="330" y="178" class="label">Live runtime signals</text>
  <text x="330" y="211" class="detail">Tab topology · input · media · requests · streams</text>

  <path d="M600 235V274" class="edge"/>
  <rect x="220" y="280" width="760" height="100" rx="18" class="box"/>
  <circle cx="275" cy="330" r="29" fill="#79c0ff"/>
  <text x="275" y="338" class="step">2</text>
  <text x="330" y="323" class="label">Fresh snapshot and ordered policy</text>
  <text x="330" y="356" class="detail">Visibility · active work · site rules · idle threshold</text>

  <path d="M600 380V419" class="edge"/>
  <rect x="150" y="425" width="900" height="190" rx="22" fill="#132238" stroke="#a371f7" stroke-width="3"/>
  <circle cx="205" cy="475" r="29" fill="#bc8cff"/>
  <text x="205" y="483" class="step">3</text>
  <text x="260" y="468" class="label">Whole-page CDP capture</text>
  <text x="260" y="501" class="detail">Page.getLayoutMetrics + Page.captureScreenshot</text>
  <rect x="205" y="530" width="365" height="58" rx="12" fill="#211d38" stroke="#bc8cff" stroke-width="2"/>
  <text x="387" y="567" class="detail" text-anchor="middle">Document tiles</text>
  <rect x="630" y="530" width="365" height="58" rx="12" fill="#211d38" stroke="#bc8cff" stroke-width="2"/>
  <text x="812" y="567" class="detail" text-anchor="middle">Nested-scroll stitching</text>

  <path d="M600 615V654" class="edge"/>
  <rect x="220" y="660" width="760" height="90" rx="18" class="box"/>
  <text x="600" y="700" class="label" text-anchor="middle">Restore the live page</text>
  <text x="600" y="731" class="detail" text-anchor="middle">Original scroll positions and temporary markers</text>

  <path d="M600 750V785" class="edge"/>
  <polygon points="600,790 750,850 600,910 450,850" fill="#29223d" stroke="#d2a8ff" stroke-width="3"/>
  <text x="600" y="842" class="label" text-anchor="middle">Still eligible?</text>
  <text x="600" y="873" class="detail" text-anchor="middle">Commit-time gate</text>

  <path d="M750 850H895V917" class="edge"/>
  <text x="810" y="837" class="detail">YES</text>
  <rect x="775" y="920" width="350" height="58" rx="15" fill="#173a31" stroke="#3fb950" stroke-width="3"/>
  <text x="950" y="957" class="label" text-anchor="middle">4 · Atomic commit</text>

  <path d="M450 850H310V917" class="edge" style="stroke:#f85149;marker-end:none"/>
  <text x="345" y="837" class="detail">NO</text>
  <rect x="75" y="920" width="350" height="58" rx="15" fill="#3b2025" stroke="#f85149" stroke-width="3"/>
  <text x="250" y="957" class="label" text-anchor="middle">Remain awake</text>
</svg>
